<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d">
  <title id="t">Mapplic-style interactive floor plan with glowing pins</title>
  <desc id="d">A neon office floor plan: dev room, standup, coffee, prod servers, a meeting room that could have been an email, and Room 404, which is not found. Pins drop in and pulse; a dashed route leads from "You are here (probably)" to Room 404.</desc>
  <style>
    .bg { fill: #070910; }
    .grid { stroke: rgba(120,150,255,.07); stroke-width: 1; }
    .walls path, .ghost path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .w-wide { stroke: #3df5ff; stroke-opacity: .07; stroke-width: 9; }
    .w-mid  { stroke: #3df5ff; stroke-opacity: .2;  stroke-width: 3.5; }
    .w-line { stroke: #9ff9ff; stroke-opacity: .9;  stroke-width: 1.3; }
    .outer-wide { fill: none; stroke: #8a7dff; stroke-opacity: .08; stroke-width: 12; }
    .outer { fill: rgba(14,17,30,.55); stroke: #8a7dff; stroke-opacity: .55; stroke-width: 1.4; }
    .ghost path { stroke: #ff3df2; stroke-width: 1.3; stroke-dasharray: 5 6; stroke-opacity: .75; }
    .ghost .g-line { animation: ghost 3.2s ease-in-out infinite; }
    .ghost .g-wide { stroke-width: 6; stroke-opacity: .06; stroke-dasharray: 5 6; }
    .corridor { stroke: rgba(160,200,255,.14); stroke-width: 1; stroke-dasharray: 2 7; fill: none; }
    .lbl { font: 600 14px/1 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .06em; fill: #7c86ad; }
    .lbl-404 { fill: #ff3df2; fill-opacity: .7; }
    .qmark { font: 800 64px/1 "Bricolage Grotesque", ui-rounded, system-ui, sans-serif; fill: #ff3df2; fill-opacity: .12; text-anchor: middle; }
    .f { fill: none; stroke-width: 1.1; stroke-opacity: .55; }
    .thin { stroke-width: .8; stroke-opacity: .35; }
    .f-v { stroke: #8a7dff; } .f-c { stroke: #3df5ff; } .f-a { stroke: #ffb23d; }
    .f-l { stroke: #b6ff3d; } .f-r { stroke: #ff4d6d; } .f-m { stroke: #8a7dff; }
    .mon { stroke-width: 2; stroke-opacity: .9; animation: blink 2.6s steps(2, jump-none) infinite; }
    .escape { animation: escape 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .led { stroke: none; animation: blink 1.4s steps(2, jump-none) infinite; }
    .led-l { fill: #b6ff3d; } .led-r { fill: #ff4d6d; } .led-a { fill: #ffb23d; }
    .steam { fill: none; stroke: #ffb23d; stroke-width: 1.2; stroke-linecap: round; opacity: 0; animation: steam 2.4s ease-out infinite; }
    .route-wide { fill: none; stroke: #ff3df2; stroke-opacity: .12; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .route { fill: none; stroke: #ff7af6; stroke-width: 2; stroke-dasharray: 7 7; stroke-linecap: round; stroke-linejoin: round; animation: flow 1.1s linear infinite; }
    .comet { fill: none; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 3 97; stroke-dashoffset: 100; animation: comet 3.4s cubic-bezier(.45,0,.55,1) infinite; animation-delay: 1.6s; opacity: .95; }
    .ring { fill: none; stroke: var(--c); stroke-width: 1.4; opacity: 0; transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
    .shadow { fill: var(--c); opacity: .35; transform-box: fill-box; transform-origin: center; animation: shadow .9s cubic-bezier(.3,1.4,.5,1) both; }
    .drop { animation: drop .9s cubic-bezier(.3,1.4,.5,1) both; }
    .bob-on { animation: bob 2.8s ease-in-out infinite; animation-delay: 1.5s; }
    .pin-glow { fill: none; stroke: var(--c); stroke-opacity: .22; stroke-width: 7; }
    .pin { fill: var(--c); stroke: #fff; stroke-opacity: .55; stroke-width: 1; }
    .pin-hole { fill: #070910; }
    .pin-shine { fill: none; stroke: #fff; stroke-opacity: .6; stroke-width: 1.4; stroke-linecap: round; }
    .tip { transform-box: fill-box; transform-origin: 50% 100%; }
    .tip-glow { fill: none; stroke: var(--c); stroke-opacity: .16; stroke-width: 8; stroke-linejoin: round; }
    .tip-bg { fill: rgba(11,13,22,.92); stroke: var(--c); stroke-width: 1.3; stroke-linejoin: round; }
    .tip-text { font: 700 15px/1 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-anchor: middle; }
    .tip-title { fill: #e9ecff; }
    .tip-sub { fill: #9aa3c7; font-weight: 500; }
    .tip-a { opacity: 1; animation: tip 12s ease-in-out infinite; animation-delay: 1.4s; }
    .tip-b { opacity: 0; animation: tip 12s ease-in-out infinite; animation-delay: 7.4s; animation-fill-mode: backwards; }
    .tip-a { animation-fill-mode: backwards; }
    .sweep { animation: sweep 8s linear infinite; mix-blend-mode: screen; }
    .foot { font: 500 12px/1 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #7c86ad; letter-spacing: .06em; }
    .compass path { fill: none; stroke: #9aa3c7; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
    .compass text { font: 700 9px/1 "JetBrains Mono", ui-monospace, Menlo, monospace; fill: #9aa3c7; text-anchor: middle; }

    @keyframes drop { 0% { transform: translateY(-80px); opacity: 0; } 55% { transform: translateY(0); opacity: 1; } 75% { transform: translateY(-7px); } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes shadow { 0% { transform: scale(.2); opacity: 0; } 55% { transform: scale(1.2); opacity: .45; } 100% { transform: scale(1); opacity: .35; } }
    @keyframes ring { 0% { transform: scale(.4); opacity: .95; } 100% { transform: scale(2.6); opacity: 0; } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes comet { 0% { stroke-dashoffset: 100; opacity: 0; } 8% { opacity: 1; } 85% { opacity: 1; } 100% { stroke-dashoffset: 3; opacity: 0; } }
    @keyframes tip { 0% { opacity: 0; transform: translateY(6px) scale(.8); } 4% { opacity: 1; transform: none; } 44% { opacity: 1; transform: none; } 48%, 100% { opacity: 0; transform: translateY(4px) scale(.92); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(4px); } 30% { opacity: .7; } 100% { opacity: 0; transform: translateY(-10px); } }
    @keyframes ghost { 0%, 100% { stroke-opacity: .75; } 50% { stroke-opacity: .25; } }
    @keyframes escape { 0%, 70%, 100% { transform: translate(0, 0); } 80% { transform: translate(5px, -3px); } 90% { transform: translate(2px, 1px); } }
    @keyframes sweep { 0% { transform: translateX(-180px); } 100% { transform: translateX(700px); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .tip-a { opacity: 1; } .tip-b { opacity: 0; }
      .ring { opacity: 0; } .steam { opacity: .5; } .comet { opacity: 0; }
    }
  </style>
  <defs>
