      <path d="M20 0H0V20" fill="none" class="grid"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#11183a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#070910" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweepg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3df5ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#3df5ff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#3df5ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bld"><rect x="30" y="30" width="580" height="340" rx="22"/></clipPath>
    <g id="walls">
      <path d="M131 170H176Q186 170 186 160V56Q186 46 176 46H56Q46 46 46 56V160Q46 170 56 170H101"/>
