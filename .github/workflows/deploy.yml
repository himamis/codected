name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time; a newer push waits for the running one instead of racing it.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Unit tests
        run: node --test tests/*.test.mjs

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # boots the real site in Chromium (desktop + phone): a broken import or a console error stops the deploy
      - name: Smoke test
        run: npm run smoke

      - name: Deploy site/ to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          clean: true
